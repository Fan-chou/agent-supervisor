name: release
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: go -C ui vet ./...
      - name: package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-supervisor-macos-arm64
          path: dist/*darwin-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-supervisor-macos-amd64
          path: dist/*darwin-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-supervisor-windows-amd64
          path: dist/*windows-amd64.zip
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
